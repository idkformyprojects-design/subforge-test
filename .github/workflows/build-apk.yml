name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Optional: sign with your own release key. Add these 4 repository secrets once:
      #   RELEASE_KEYSTORE_BASE64  (base64 of your .jks file)
      #   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
      # Without them the APK is signed with a debug key (fine for installing on your own phone).
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and AAB (Play Store bundle)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Name files after the app version
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          mkdir -p ../dist
          mv app/build/outputs/apk/release/*.apk "../dist/SubForge-v$V-arm64.apk"
          mv app/build/outputs/bundle/release/*.aab "../dist/SubForge-v$V.aab"
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: SubForge-${{ env.APP_VERSION }}
          path: dist/

      - name: Publish as a GitHub Release (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" ../dist/* \
            --repo "${{ github.repository }}" \
            --title "SubForge v${{ env.APP_VERSION }} (build ${{ github.run_number }})" \
            --notes "APK: install on Android (allow installing from this source). AAB: for uploading to Google Play." \
            --target "${{ github.sha }}" --latest
